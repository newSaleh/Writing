<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>يوميات</title>
<meta name="description" content="مساحة شخصية بسيطة للكتابة اليومية" />
<meta id="themeColorMeta" name="theme-color" content="#f6f1e7" />
<style>
  :root {
    --bg: #f6f1e7;
    --text: #2e2a24;
    --muted: #8a8175;
    --border: rgba(46, 42, 36, 0.12);
    --border-strong: rgba(46, 42, 36, 0.22);
    --ink-bg: #2e2a24;
    --ink-text: #f6f1e7;
    --danger: #9c4a3f;
    --danger-bg: rgba(156, 74, 63, 0.08);
    --focus: #6b5f4d;
    --success: #4a6b52;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17;
      --text: #e9e3d6;
      --muted: #948b7c;
      --border: rgba(233, 227, 214, 0.12);
      --border-strong: rgba(233, 227, 214, 0.24);
      --ink-bg: #e9e3d6;
      --ink-text: #1c1a17;
      --danger: #c98177;
      --danger-bg: rgba(201, 129, 119, 0.1);
      --focus: #c7bca6;
      --success: #8fb097;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1c1a17;
    --text: #e9e3d6;
    --muted: #948b7c;
    --border: rgba(233, 227, 214, 0.12);
    --border-strong: rgba(233, 227, 214, 0.24);
    --ink-bg: #e9e3d6;
    --ink-text: #1c1a17;
    --danger: #c98177;
    --danger-bg: rgba(201, 129, 119, 0.1);
    --focus: #c7bca6;
    --success: #8fb097;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Naskh Arabic", "Noto Sans Arabic", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: no-preference) {
    .btn,
    .date-input,
    .dialog-overlay,
    .dialog {
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, opacity 180ms ease, transform 180ms ease;
    }
  }

  .page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 28px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(20px, env(safe-area-inset-left, 0px));
    width: 100%;
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-end;
    padding-bottom: 8px;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .theme-toggle:hover {
    border-color: var(--border);
    color: var(--text);
  }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .theme-toggle svg {
    width: 20px;
    height: 20px;
  }

  .theme-toggle .icon-moon {
    display: none;
  }

  :root[data-theme="dark"] .theme-toggle .icon-sun {
    display: none;
  }

  :root[data-theme="dark"] .theme-toggle .icon-moon {
    display: block;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .icon-sun {
      display: none;
    }

    :root:not([data-theme="light"]) .theme-toggle .icon-moon {
      display: block;
    }
  }

  .entry-header {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 20px;
  }

  .title-input {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: clamp(1.5rem, 4.5vw, 1.85rem);
    font-weight: 600;
    line-height: 1.35;
    padding: 4px 2px;
    caret-color: var(--focus);
    unicode-bidi: plaintext;
  }

  .title-input::placeholder {
    color: var(--muted);
    opacity: 0.6;
    font-weight: 500;
  }

  .title-input:focus-visible {
    outline: none;
  }

  .date-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .date-label {
    font-size: 0.95rem;
    color: var(--muted);
  }

  .date-input {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 8px;
    outline: none;
    direction: ltr;
    cursor: pointer;
    min-height: 32px;
  }

  .date-input:hover {
    border-color: var(--border);
  }

  .date-input:focus-visible {
    border-color: var(--focus);
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .editor-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }

  .editor {
    flex: 1 1 auto;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 1.15rem;
    line-height: 1.9;
    padding: 2px;
    unicode-bidi: plaintext;
    caret-color: var(--focus);
  }

  .editor::placeholder {
    color: var(--muted);
    opacity: 0.55;
  }

  .actions {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 16px;
    margin-top: 8px;
    border-top: 1px solid var(--border);
  }

  .word-count {
    font-size: 0.9rem;
    color: var(--muted);
  }

  .buttons-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    border-radius: 12px;
    padding: 13px 22px;
    min-height: 48px;
    cursor: pointer;
    border: 1px solid transparent;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--ink-bg);
    color: var(--ink-text);
    border-color: var(--ink-bg);
  }

  .btn-primary:hover {
    opacity: 0.88;
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

  .btn-primary.is-success {
    background: var(--success);
    border-color: var(--success);
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border-color: transparent;
    padding-inline: 14px;
  }

  .btn-ghost:hover {
    color: var(--danger);
  }

  .dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28, 26, 23, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }

  .dialog-overlay[hidden] {
    display: none;
  }

  .dialog {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 26px 24px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
  }

  .dialog-text {
    margin: 0 0 22px 0;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--text);
    text-align: center;
  }

  .dialog-actions {
    display: flex;
    gap: 12px;
  }

  .dialog-actions .btn {
    flex: 1 1 0;
  }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border-strong);
  }

  .btn-secondary:hover {
    background: var(--border);
  }

  .btn-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: var(--danger);
  }

  .btn-danger:hover {
    background: var(--danger);
    color: var(--ink-text);
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ---- Export preview ---- */

  .export-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 20;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  }

  .export-overlay[hidden] {
    display: none;
  }

  .export-topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
  }

  .icon-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .icon-btn:hover {
    background: var(--border);
    color: var(--text);
  }

  .icon-btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .icon-btn svg {
    width: 20px;
    height: 20px;
  }

  .export-title-label {
    flex: 1 1 auto;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    text-align: center;
  }

  .export-page-indicator {
    flex: 0 0 auto;
    font-size: 0.9rem;
    color: var(--muted);
    min-width: 52px;
    direction: ltr;
  }

  .export-controls {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 16px;
  }

  .export-control-label {
    font-size: 0.9rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .export-controls input[type="range"] {
    flex: 1 1 auto;
    accent-color: var(--focus);
  }

  .export-control-value {
    font-size: 0.9rem;
    color: var(--muted);
    min-width: 26px;
    text-align: center;
  }

  .export-stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .export-page-wrap {
    flex: 1 1 auto;
    height: 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .export-page-viewport {
    position: relative;
    overflow: hidden;
    flex: 0 0 auto;
    border-radius: 6px;
    box-shadow: 0 2px 24px rgba(0, 0, 0, 0.16);
  }

  .export-page {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    width: 1000px;
    height: 1120px;
    box-sizing: border-box;
    background: #f6f1e7;
    color: #2e2a24;
    padding: 80px 90px 90px;
    direction: rtl;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Naskh Arabic", "Noto Sans Arabic", "Helvetica Neue", Arial, sans-serif;
  }

  .export-page-title {
    display: inline-block;
    max-width: 100%;
    margin: 0 0 40px 0;
    padding-bottom: 14px;
    border-bottom: 3px solid #9c3b35;
    color: #9c3b35;
    font-weight: 700;
    line-height: 1.3;
  }

  .export-page-title:empty {
    display: none;
    margin: 0;
    padding: 0;
    border: none;
  }

  .export-page-body {
    text-align: start;
    white-space: pre-wrap;
    word-wrap: break-word;
    unicode-bidi: plaintext;
    line-height: 1.8;
  }

  .export-page-footer {
    position: absolute;
    bottom: 34px;
    left: 90px;
    font-size: 15px;
    color: #8a8175;
    direction: ltr;
  }

  .nav-btn {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-btn:hover {
    background: var(--border);
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .nav-btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .export-actions {
    flex: 0 0 auto;
    display: flex;
    gap: 12px;
    padding-top: 16px;
  }

  .export-actions .btn {
    flex: 1 1 0;
  }

  .export-hint {
    flex: 0 0 auto;
    margin: 10px 0 0;
    font-size: 0.82rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }

  .measure-box {
    position: absolute;
    top: -9999px;
    left: -9999px;
    visibility: hidden;
    white-space: pre-wrap;
    word-wrap: break-word;
    unicode-bidi: plaintext;
    box-sizing: border-box;
  }

  .measure-title {
    display: inline-block;
    width: auto;
    white-space: normal;
    font-weight: 700;
    line-height: 1.3;
    padding-bottom: 14px;
    border-bottom: 3px solid #9c3b35;
  }

  .print-pages {
    display: none;
  }

  @media print {
    body > *:not(.print-pages) {
      display: none !important;
    }

    .print-pages {
      display: block !important;
    }

    .print-page {
      width: 1000px;
      height: 1120px;
      box-sizing: border-box;
      background: #f6f1e7 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      color: #2e2a24;
      padding: 80px 90px 90px;
      position: relative;
      direction: rtl;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Naskh Arabic", "Noto Sans Arabic", "Helvetica Neue", Arial, sans-serif;
      page-break-after: always;
      break-after: page;
    }

    .print-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }
  }

  @page {
    size: 1000px 1120px;
    margin: 0;
  }

  @media (max-width: 480px) {
    .page {
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .btn {
      flex: 1 1 0;
    }

    .export-title-label {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="التبديل إلى الوضع الليلي">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" />
        <path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
      </svg>
    </button>
  </div>
  <header class="entry-header">
    <input
      id="title"
      class="title-input"
      type="text"
      dir="auto"
      placeholder="عنوان اليوم…"
      autocomplete="off"
      autofocus
      aria-label="عنوان اليوم"
    />
    <div class="date-row">
      <label for="date" class="date-label">التاريخ</label>
      <input id="date" class="date-input" type="date" aria-label="اختيار التاريخ" />
    </div>
  </header>

  <main class="editor-wrap">
    <textarea
      id="editor"
      class="editor"
      dir="auto"
      placeholder="ابدأ الكتابة هنا…"
      aria-label="مساحة الكتابة"
    ></textarea>
  </main>

  <footer class="actions">
    <p id="wordCount" class="word-count" aria-live="polite">0 كلمة</p>
    <div class="buttons-row">
      <button id="copyBtn" class="btn btn-primary" type="button">نسخ</button>
      <button id="exportBtn" class="btn btn-secondary" type="button">تصدير</button>
      <button id="deleteBtn" class="btn btn-ghost" type="button">حذف</button>
    </div>
  </footer>
</div>

<div id="exportOverlay" class="export-overlay" hidden role="dialog" aria-modal="true" aria-label="معاينة التصدير">
  <div class="export-topbar">
    <button id="exportClose" class="icon-btn" type="button" aria-label="إغلاق المعاينة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
    <p class="export-title-label">معاينة التصدير</p>
    <span id="exportPageIndicator" class="export-page-indicator"></span>
  </div>

  <div class="export-controls">
    <label for="fontSizeRange" class="export-control-label">حجم الخط</label>
    <input id="fontSizeRange" type="range" min="14" max="30" step="1" value="20" />
    <span id="fontSizeValue" class="export-control-value">20</span>
  </div>

  <div class="export-stage">
    <button id="prevPage" class="nav-btn" type="button" aria-label="الصفحة السابقة">›</button>
    <div class="export-page-wrap">
      <div id="exportPageViewport" class="export-page-viewport">
        <div id="exportPage" class="export-page">
          <h2 id="exportPageTitle" class="export-page-title"></h2>
          <div id="exportPageBody" class="export-page-body" dir="auto"></div>
          <div id="exportPageFooter" class="export-page-footer"></div>
        </div>
      </div>
    </div>
    <button id="nextPage" class="nav-btn" type="button" aria-label="الصفحة التالية">‹</button>
  </div>

  <div class="export-actions">
    <button id="exportPdfBtn" class="btn btn-primary" type="button">تنزيل PDF</button>
    <button id="exportImagesBtn" class="btn btn-secondary" type="button">تنزيل كصور</button>
  </div>
  <p class="export-hint">لظهور خلفية الصفحة في PDF، فعّل خيار «رسومات الخلفية» في نافذة الطباعة.</p>
</div>

<div id="printPages" class="print-pages" aria-hidden="true"></div>
<div id="measureBox" class="measure-box" aria-hidden="true"></div>
<div id="titleMeasureBox" class="measure-box measure-title" aria-hidden="true"></div>

<div id="confirmDialog" class="dialog-overlay" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogText">
    <p id="dialogText" class="dialog-text">هل تريد حذف هذا النص؟</p>
    <div class="dialog-actions">
      <button id="cancelDelete" class="btn btn-secondary" type="button">إلغاء</button>
      <button id="confirmDelete" class="btn btn-danger" type="button">حذف</button>
    </div>
  </div>
</div>

<div id="liveStatus" class="visually-hidden" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "dailyJournal.entry";
  var THEME_KEY = "dailyJournal.theme";
  var LIGHT_COLOR = "#f6f1e7";
  var DARK_COLOR = "#1c1a17";

  var PAGE_W = 1000;
  var PAGE_H = 1120;
  var PAGE_PAD_X = 90;
  var PAGE_PAD_TOP = 80;
  var PAGE_PAD_BOTTOM = 90;
  var CONTENT_WIDTH = PAGE_W - PAGE_PAD_X * 2;
  var CONTENT_HEIGHT_MAX = PAGE_H - PAGE_PAD_TOP - PAGE_PAD_BOTTOM;
  var BODY_LINE_HEIGHT = 1.8;
  var TITLE_FONT_RATIO = 1.35;
  var TITLE_MARGIN_BELOW = 40;

  var titleEl = document.getElementById("title");
  var dateEl = document.getElementById("date");
  var editorEl = document.getElementById("editor");
  var copyBtn = document.getElementById("copyBtn");
  var deleteBtn = document.getElementById("deleteBtn");
  var wordCountEl = document.getElementById("wordCount");
  var dialog = document.getElementById("confirmDialog");
  var cancelDeleteBtn = document.getElementById("cancelDelete");
  var confirmDeleteBtn = document.getElementById("confirmDelete");
  var liveStatus = document.getElementById("liveStatus");
  var themeToggle = document.getElementById("themeToggle");
  var themeColorMeta = document.getElementById("themeColorMeta");

  var exportBtn = document.getElementById("exportBtn");
  var exportOverlay = document.getElementById("exportOverlay");
  var exportCloseBtn = document.getElementById("exportClose");
  var exportPageIndicatorEl = document.getElementById("exportPageIndicator");
  var fontSizeRange = document.getElementById("fontSizeRange");
  var fontSizeValueEl = document.getElementById("fontSizeValue");
  var exportPageWrapEl = document.querySelector(".export-page-wrap");
  var exportPageViewportEl = document.getElementById("exportPageViewport");
  var exportPageEl = document.getElementById("exportPage");
  var exportPageTitleEl = document.getElementById("exportPageTitle");
  var exportPageBodyEl = document.getElementById("exportPageBody");
  var exportPageFooterEl = document.getElementById("exportPageFooter");
  var prevPageBtn = document.getElementById("prevPage");
  var nextPageBtn = document.getElementById("nextPage");
  var exportPdfBtn = document.getElementById("exportPdfBtn");
  var exportImagesBtn = document.getElementById("exportImagesBtn");
  var printPagesEl = document.getElementById("printPages");
  var measureBox = document.getElementById("measureBox");
  var titleMeasureBox = document.getElementById("titleMeasureBox");

  var currentFontSize = 20;
  var currentPages = [];
  var currentPageIndex = 0;

  var ARABIC_MONTHS = [
    "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
    "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
  ];

  function todayISO() {
    var now = new Date();
    var y = now.getFullYear();
    var m = String(now.getMonth() + 1).padStart(2, "0");
    var d = String(now.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  function formatArabicDate(isoDate) {
    var parts = isoDate.split("-");
    if (parts.length !== 3) return isoDate;
    var year = parseInt(parts[0], 10);
    var month = parseInt(parts[1], 10);
    var day = parseInt(parts[2], 10);
    var monthName = ARABIC_MONTHS[month - 1] || "";
    return day + " " + monthName + " " + year;
  }

  function loadEntry() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function saveEntry() {
    try {
      var data = {
        title: titleEl.value,
        date: dateEl.value,
        text: editorEl.value
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      /* localStorage unavailable — writing still works, just not persisted */
    }
  }

  function countWords(text) {
    var matches = text.trim().match(/\S+/g);
    return matches ? matches.length : 0;
  }

  function formatWordCount(n) {
    if (n === 0) return "0 كلمة";
    if (n === 1) return "كلمة واحدة";
    if (n === 2) return "كلمتان";
    if (n >= 3 && n <= 10) return n + " كلمات";
    return n + " كلمة";
  }

  function updateWordCount() {
    wordCountEl.textContent = formatWordCount(countWords(editorEl.value));
  }

  function updateExportAvailability() {
    exportBtn.disabled = !(titleEl.value.trim() || editorEl.value.trim());
  }

  function computeBreakPoints(text) {
    var points = [0];
    var re = /\s+/g;
    var m;
    while ((m = re.exec(text))) {
      points.push(m.index + m[0].length);
    }
    if (points[points.length - 1] !== text.length) points.push(text.length);
    return points;
  }

  function configureMeasureBox(fontSizePx) {
    measureBox.style.width = CONTENT_WIDTH + "px";
    measureBox.style.fontSize = fontSizePx + "px";
    measureBox.style.lineHeight = String(BODY_LINE_HEIGHT);
  }

  function measureHeight(str) {
    measureBox.textContent = str;
    return measureBox.offsetHeight;
  }

  function measureTitleHeight(text, fontSizePx) {
    titleMeasureBox.style.width = CONTENT_WIDTH + "px";
    titleMeasureBox.style.fontSize = Math.round(fontSizePx * TITLE_FONT_RATIO) + "px";
    titleMeasureBox.textContent = text;
    return titleMeasureBox.offsetHeight + TITLE_MARGIN_BELOW;
  }

  function findCut(text, startIdx, breakpoints, maxHeight) {
    var lo = 0, hi = breakpoints.length - 1;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (breakpoints[mid] > startIdx) hi = mid; else lo = mid + 1;
    }
    if (breakpoints[lo] <= startIdx) return text.length;
    var bLo = lo, bHi = breakpoints.length - 1;
    var best = breakpoints[lo];
    while (bLo <= bHi) {
      var m = (bLo + bHi) >> 1;
      var candidate = breakpoints[m];
      var h = measureHeight(text.slice(startIdx, candidate));
      if (h <= maxHeight) {
        best = candidate;
        bLo = m + 1;
      } else {
        bHi = m - 1;
      }
    }
    return best;
  }

  function paginate(fullText, titleText, fontSizePx) {
    configureMeasureBox(fontSizePx);
    if (fullText.length === 0) {
      return [{ title: titleText || null, body: "" }];
    }
    var breakpoints = computeBreakPoints(fullText);
    var titleHeight = titleText ? measureTitleHeight(titleText, fontSizePx) : 0;
    var pages = [];
    var idx = 0;
    var first = true;
    var minLine = fontSizePx * BODY_LINE_HEIGHT;
    while (idx < fullText.length) {
      var available = CONTENT_HEIGHT_MAX - (first ? titleHeight : 0);
      if (available < minLine) available = minLine;
      var cut = findCut(fullText, idx, breakpoints, available);
      if (cut <= idx) cut = fullText.length;
      pages.push({ title: first ? (titleText || null) : null, body: fullText.slice(idx, cut) });
      idx = cut;
      first = false;
    }
    return pages;
  }

  function recomputePagination() {
    currentPages = paginate(editorEl.value, titleEl.value.trim(), currentFontSize);
  }

  function updatePreviewScale() {
    var rect = exportPageWrapEl.getBoundingClientRect();
    var availW = Math.max(rect.width - 16, 40);
    var availH = Math.max(rect.height - 16, 40);
    var scale = Math.min(availW / PAGE_W, availH / PAGE_H, 1);
    if (!isFinite(scale) || scale <= 0) scale = 0.3;
    exportPageEl.style.transform = "scale(" + scale + ")";
    exportPageViewportEl.style.width = Math.round(PAGE_W * scale) + "px";
    exportPageViewportEl.style.height = Math.round(PAGE_H * scale) + "px";
  }

  function renderCurrentPage() {
    var total = currentPages.length;
    var page = currentPages[currentPageIndex];
    exportPageTitleEl.textContent = page.title || "";
    exportPageBodyEl.textContent = page.body;
    exportPageFooterEl.textContent = (currentPageIndex + 1) + " / " + total;
    exportPageBodyEl.style.fontSize = currentFontSize + "px";
    exportPageTitleEl.style.fontSize = Math.round(currentFontSize * TITLE_FONT_RATIO) + "px";
    exportPageIndicatorEl.textContent = (currentPageIndex + 1) + " / " + total;
    prevPageBtn.disabled = currentPageIndex === 0;
    nextPageBtn.disabled = currentPageIndex === total - 1;
    updatePreviewScale();
  }

  function goPrevPage() {
    if (currentPageIndex > 0) {
      currentPageIndex--;
      renderCurrentPage();
    }
  }

  function goNextPage() {
    if (currentPageIndex < currentPages.length - 1) {
      currentPageIndex++;
      renderCurrentPage();
    }
  }

  function onExportKeydown(e) {
    if (e.key === "Escape") {
      closeExport();
    } else if (e.key === "ArrowRight") {
      goPrevPage();
    } else if (e.key === "ArrowLeft") {
      goNextPage();
    }
  }

  function openExport() {
    if (exportBtn.disabled) return;
    currentFontSize = parseInt(fontSizeRange.value, 10) || 20;
    fontSizeValueEl.textContent = String(currentFontSize);
    recomputePagination();
    currentPageIndex = 0;
    exportOverlay.hidden = false;
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onExportKeydown);
    renderCurrentPage();
    exportCloseBtn.focus();
  }

  function closeExport() {
    exportOverlay.hidden = true;
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onExportKeydown);
    exportBtn.focus();
  }

  function fileBaseName() {
    var title = titleEl.value.trim();
    var base = title ? title.replace(/\s+/g, "-") : "يوميات";
    return base + "-" + (dateEl.value || todayISO());
  }

  function buildPrintPages() {
    printPagesEl.innerHTML = "";
    var total = currentPages.length;
    currentPages.forEach(function (page, i) {
      var pageEl = document.createElement("div");
      pageEl.className = "print-page";
      if (page.title) {
        var h = document.createElement("h2");
        h.className = "export-page-title";
        h.textContent = page.title;
        h.style.fontSize = Math.round(currentFontSize * TITLE_FONT_RATIO) + "px";
        pageEl.appendChild(h);
      }
      var body = document.createElement("div");
      body.className = "export-page-body";
      body.setAttribute("dir", "auto");
      body.textContent = page.body;
      body.style.fontSize = currentFontSize + "px";
      pageEl.appendChild(body);

      var footer = document.createElement("div");
      footer.className = "export-page-footer";
      footer.textContent = (i + 1) + " / " + total;
      pageEl.appendChild(footer);

      printPagesEl.appendChild(pageEl);
    });
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function buildPageSVG(pageData, index, total, fontSizePx) {
    var titleHTML = pageData.title
      ? '<h2 style="margin:0 0 ' + TITLE_MARGIN_BELOW + 'px 0;padding-bottom:14px;border-bottom:3px solid #9c3b35;color:#9c3b35;font-weight:700;font-size:' + Math.round(fontSizePx * TITLE_FONT_RATIO) + 'px;line-height:1.3;display:inline-block;max-width:100%;">' + escapeHtml(pageData.title) + "</h2>"
      : "";
    var bodyHTML = '<div dir="auto" style="text-align:start;white-space:pre-wrap;word-wrap:break-word;unicode-bidi:plaintext;font-size:' + fontSizePx + 'px;line-height:' + BODY_LINE_HEIGHT + ';color:#2e2a24;">' + escapeHtml(pageData.body) + "</div>";
    var footerHTML = '<div style="position:absolute;bottom:34px;left:' + PAGE_PAD_X + 'px;font-size:15px;color:#8a8175;direction:ltr;">' + (index + 1) + " / " + total + "</div>";

    var inner =
      '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + PAGE_W + "px;height:" + PAGE_H + "px;box-sizing:border-box;background:#f6f1e7;padding:" + PAGE_PAD_TOP + "px " + PAGE_PAD_X + "px " + PAGE_PAD_BOTTOM + 'px;position:relative;direction:rtl;text-align:center;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,\'Noto Naskh Arabic\',\'Noto Sans Arabic\',\'Helvetica Neue\',Arial,sans-serif;">' +
      titleHTML + bodyHTML + footerHTML +
      "</div>";

    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + PAGE_W + '" height="' + PAGE_H + '"><foreignObject width="100%" height="100%">' + inner + "</foreignObject></svg>";
  }

  function renderSVGToCanvas(svgString, scale) {
    return new Promise(function (resolve, reject) {
      var canvas = document.createElement("canvas");
      canvas.width = PAGE_W * scale;
      canvas.height = PAGE_H * scale;
      var ctx = canvas.getContext("2d");
      var img = new Image();
      img.onload = function () {
        ctx.fillStyle = "#f6f1e7";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas);
      };
      img.onerror = function (e) {
        reject(e);
      };
      /* data: URI (not blob:) avoids Chromium tainting the canvas for SVG+foreignObject sources */
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString);
    });
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function sleep(ms) {
    return new Promise(function (resolve) {
      window.setTimeout(resolve, ms);
    });
  }

  function exportImages() {
    if (exportImagesBtn.disabled) return;
    var original = exportImagesBtn.textContent;
    exportImagesBtn.disabled = true;
    var base = fileBaseName();
    var total = currentPages.length;

    function next(i) {
      if (i >= total) {
        exportImagesBtn.disabled = false;
        exportImagesBtn.textContent = original;
        return;
      }
      exportImagesBtn.textContent = "جارٍ التصدير… " + (i + 1) + "/" + total;
      var svg = buildPageSVG(currentPages[i], i, total, currentFontSize);
      renderSVGToCanvas(svg, 2)
        .then(function (canvas) {
          return new Promise(function (resolve) {
            canvas.toBlob(resolve, "image/png");
          });
        })
        .then(function (blob) {
          downloadBlob(blob, base + "-" + (i + 1) + "-of-" + total + ".png");
          return sleep(200);
        })
        .then(function () {
          next(i + 1);
        })
        .catch(function () {
          exportImagesBtn.disabled = false;
          exportImagesBtn.textContent = original;
          window.alert("تعذّر تصدير الصور في هذا المتصفح. جرّب تنزيل PDF بدلاً من ذلك.");
        });
    }

    next(0);
  }

  function getStoredTheme() {
    try {
      return localStorage.getItem(THEME_KEY);
    } catch (e) {
      return null;
    }
  }

  function systemPrefersDark() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function getEffectiveTheme() {
    var stored = getStoredTheme();
    if (stored === "light" || stored === "dark") return stored;
    return systemPrefersDark() ? "dark" : "light";
  }

  function updateToggleUI(theme) {
    var isDark = theme === "dark";
    themeToggle.setAttribute("aria-pressed", isDark ? "true" : "false");
    themeToggle.setAttribute("aria-label", isDark ? "التبديل إلى الوضع النهاري" : "التبديل إلى الوضع الليلي");
    themeColorMeta.setAttribute("content", isDark ? DARK_COLOR : LIGHT_COLOR);
  }

  function initTheme() {
    var stored = getStoredTheme();
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    }
    updateToggleUI(getEffectiveTheme());
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (!getStoredTheme()) updateToggleUI(getEffectiveTheme());
      });
    }
  }

  function toggleTheme() {
    var next = getEffectiveTheme() === "dark" ? "light" : "dark";
    try {
      localStorage.setItem(THEME_KEY, next);
    } catch (e) {
      /* ignore */
    }
    document.documentElement.setAttribute("data-theme", next);
    updateToggleUI(next);
  }

  function init() {
    var saved = loadEntry();
    if (saved) {
      titleEl.value = saved.title || "";
      editorEl.value = saved.text || "";
      dateEl.value = saved.date || todayISO();
    } else {
      dateEl.value = todayISO();
    }
    updateWordCount();
  }

  function buildCopyText() {
    var title = titleEl.value.trim();
    var dateLabel = formatArabicDate(dateEl.value || todayISO());
    var text = editorEl.value;
    var lines = [];
    if (title) {
      lines.push(title, "");
    }
    lines.push(dateLabel, "", "");
    lines.push(text);
    return lines.join("\n");
  }

  function showCopyFeedback() {
    var original = "نسخ";
    copyBtn.textContent = "تم النسخ ✓";
    copyBtn.classList.add("is-success");
    liveStatus.textContent = "تم نسخ النص";
    window.clearTimeout(showCopyFeedback._t);
    showCopyFeedback._t = window.setTimeout(function () {
      copyBtn.textContent = original;
      copyBtn.classList.remove("is-success");
    }, 1600);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopyFeedback).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "fixed";
    temp.style.opacity = "0";
    document.body.appendChild(temp);
    temp.focus();
    temp.select();
    try {
      document.execCommand("copy");
      showCopyFeedback();
    } catch (e) {
      /* copy not supported — nothing more we can do silently */
    }
    document.body.removeChild(temp);
  }

  function openDialog() {
    dialog.hidden = false;
    cancelDeleteBtn.focus();
    document.addEventListener("keydown", onDialogKeydown);
  }

  function closeDialog() {
    dialog.hidden = true;
    document.removeEventListener("keydown", onDialogKeydown);
    deleteBtn.focus();
  }

  function onDialogKeydown(e) {
    if (e.key === "Escape") {
      closeDialog();
    }
  }

  function performDelete() {
    titleEl.value = "";
    editorEl.value = "";
    dateEl.value = todayISO();
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      /* ignore */
    }
    closeDialog();
    updateWordCount();
    updateExportAvailability();
    titleEl.focus();
  }

  titleEl.addEventListener("input", function () {
    saveEntry();
    updateExportAvailability();
  });
  dateEl.addEventListener("change", saveEntry);
  editorEl.addEventListener("input", function () {
    saveEntry();
    updateWordCount();
    updateExportAvailability();
  });

  copyBtn.addEventListener("click", function () {
    copyToClipboard(buildCopyText());
  });

  deleteBtn.addEventListener("click", openDialog);
  cancelDeleteBtn.addEventListener("click", closeDialog);
  confirmDeleteBtn.addEventListener("click", performDelete);

  dialog.addEventListener("click", function (e) {
    if (e.target === dialog) {
      closeDialog();
    }
  });

  themeToggle.addEventListener("click", toggleTheme);

  exportBtn.addEventListener("click", openExport);
  exportCloseBtn.addEventListener("click", closeExport);
  prevPageBtn.addEventListener("click", goPrevPage);
  nextPageBtn.addEventListener("click", goNextPage);
  window.addEventListener("resize", function () {
    if (!exportOverlay.hidden) updatePreviewScale();
  });

  fontSizeRange.addEventListener("input", function () {
    currentFontSize = parseInt(fontSizeRange.value, 10) || 20;
    fontSizeValueEl.textContent = String(currentFontSize);
    recomputePagination();
    if (currentPageIndex >= currentPages.length) currentPageIndex = currentPages.length - 1;
    renderCurrentPage();
  });

  exportPdfBtn.addEventListener("click", function () {
    buildPrintPages();
    window.requestAnimationFrame(function () {
      window.print();
    });
  });

  exportImagesBtn.addEventListener("click", exportImages);

  initTheme();
  init();
  updateExportAvailability();
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>يوميات</title>
<meta name="description" content="مساحة شخصية بسيطة للكتابة اليومية" />
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
<style>
  :root {
    --bg: #f6f1e7;
    --text: #2e2a24;
    --muted: #8a8175;
    --border: rgba(46, 42, 36, 0.12);
    --border-strong: rgba(46, 42, 36, 0.22);
    --ink-bg: #2e2a24;
    --ink-text: #f6f1e7;
    --danger: #9c4a3f;
    --danger-bg: rgba(156, 74, 63, 0.08);
    --focus: #6b5f4d;
    --success: #4a6b52;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --text: #e9e3d6;
      --muted: #948b7c;
      --border: rgba(233, 227, 214, 0.12);
      --border-strong: rgba(233, 227, 214, 0.24);
      --ink-bg: #e9e3d6;
      --ink-text: #1c1a17;
      --danger: #c98177;
      --danger-bg: rgba(201, 129, 119, 0.1);
      --focus: #c7bca6;
      --success: #8fb097;
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Naskh Arabic", "Noto Sans Arabic", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: no-preference) {
    .btn,
    .date-input,
    .dialog-overlay,
    .dialog {
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, opacity 180ms ease, transform 180ms ease;
    }
  }

  .page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 28px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(20px, env(safe-area-inset-left, 0px));
    width: 100%;
  }

  .entry-header {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 20px;
  }

  .title-input {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: clamp(1.5rem, 4.5vw, 1.85rem);
    font-weight: 600;
    line-height: 1.35;
    padding: 4px 2px;
    caret-color: var(--focus);
  }

  .title-input::placeholder {
    color: var(--muted);
    opacity: 0.6;
    font-weight: 500;
  }

  .title-input:focus-visible {
    outline: none;
  }

  .date-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .date-label {
    font-size: 0.95rem;
    color: var(--muted);
  }

  .date-input {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 8px;
    outline: none;
    direction: ltr;
    cursor: pointer;
    min-height: 32px;
  }

  .date-input:hover {
    border-color: var(--border);
  }

  .date-input:focus-visible {
    border-color: var(--focus);
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .editor-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }

  .editor {
    flex: 1 1 auto;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 1.15rem;
    line-height: 1.9;
    padding: 2px;
  }

  .editor::placeholder {
    color: var(--muted);
    opacity: 0.55;
  }

  .actions {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 16px;
    margin-top: 8px;
    border-top: 1px solid var(--border);
  }

  .word-count {
    font-size: 0.9rem;
    color: var(--muted);
  }

  .buttons-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    border-radius: 12px;
    padding: 13px 22px;
    min-height: 48px;
    cursor: pointer;
    border: 1px solid transparent;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--ink-bg);
    color: var(--ink-text);
    border-color: var(--ink-bg);
  }

  .btn-primary:hover {
    opacity: 0.88;
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

  .btn-primary.is-success {
    background: var(--success);
    border-color: var(--success);
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border-color: transparent;
    padding-inline: 14px;
  }

  .btn-ghost:hover {
    color: var(--danger);
  }

  .dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28, 26, 23, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }

  .dialog-overlay[hidden] {
    display: none;
  }

  .dialog {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 26px 24px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
  }

  .dialog-text {
    margin: 0 0 22px 0;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--text);
    text-align: center;
  }

  .dialog-actions {
    display: flex;
    gap: 12px;
  }

  .dialog-actions .btn {
    flex: 1 1 0;
  }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border-strong);
  }

  .btn-secondary:hover {
    background: var(--border);
  }

  .btn-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: var(--danger);
  }

  .btn-danger:hover {
    background: var(--danger);
    color: var(--ink-text);
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    .page {
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .btn {
      flex: 1 1 0;
    }
  }
</style>
</head>
<body>

<div class="page">
  <header class="entry-header">
    <input
      id="title"
      class="title-input"
      type="text"
      placeholder="عنوان اليوم…"
      autocomplete="off"
      autofocus
      aria-label="عنوان اليوم"
    />
    <div class="date-row">
      <label for="date" class="date-label">التاريخ</label>
      <input id="date" class="date-input" type="date" aria-label="اختيار التاريخ" />
    </div>
  </header>

  <main class="editor-wrap">
    <textarea
      id="editor"
      class="editor"
      placeholder="ابدأ الكتابة هنا…"
      aria-label="مساحة الكتابة"
    ></textarea>
  </main>

  <footer class="actions">
    <p id="wordCount" class="word-count" aria-live="polite">0 كلمة</p>
    <div class="buttons-row">
      <button id="copyBtn" class="btn btn-primary" type="button">نسخ</button>
      <button id="deleteBtn" class="btn btn-ghost" type="button">حذف</button>
    </div>
  </footer>
</div>

<div id="confirmDialog" class="dialog-overlay" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogText">
    <p id="dialogText" class="dialog-text">هل تريد حذف هذا النص؟</p>
    <div class="dialog-actions">
      <button id="cancelDelete" class="btn btn-secondary" type="button">إلغاء</button>
      <button id="confirmDelete" class="btn btn-danger" type="button">حذف</button>
    </div>
  </div>
</div>

<div id="liveStatus" class="visually-hidden" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "dailyJournal.entry";

  var titleEl = document.getElementById("title");
  var dateEl = document.getElementById("date");
  var editorEl = document.getElementById("editor");
  var copyBtn = document.getElementById("copyBtn");
  var deleteBtn = document.getElementById("deleteBtn");
  var wordCountEl = document.getElementById("wordCount");
  var dialog = document.getElementById("confirmDialog");
  var cancelDeleteBtn = document.getElementById("cancelDelete");
  var confirmDeleteBtn = document.getElementById("confirmDelete");
  var liveStatus = document.getElementById("liveStatus");

  var ARABIC_MONTHS = [
    "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
    "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
  ];

  function todayISO() {
    var now = new Date();
    var y = now.getFullYear();
    var m = String(now.getMonth() + 1).padStart(2, "0");
    var d = String(now.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  function formatArabicDate(isoDate) {
    var parts = isoDate.split("-");
    if (parts.length !== 3) return isoDate;
    var year = parseInt(parts[0], 10);
    var month = parseInt(parts[1], 10);
    var day = parseInt(parts[2], 10);
    var monthName = ARABIC_MONTHS[month - 1] || "";
    return day + " " + monthName + " " + year;
  }

  function loadEntry() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function saveEntry() {
    try {
      var data = {
        title: titleEl.value,
        date: dateEl.value,
        text: editorEl.value
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      /* localStorage unavailable — writing still works, just not persisted */
    }
  }

  function countWords(text) {
    var matches = text.trim().match(/\S+/g);
    return matches ? matches.length : 0;
  }

  function formatWordCount(n) {
    if (n === 0) return "0 كلمة";
    if (n === 1) return "كلمة واحدة";
    if (n === 2) return "كلمتان";
    if (n >= 3 && n <= 10) return n + " كلمات";
    return n + " كلمة";
  }

  function updateWordCount() {
    wordCountEl.textContent = formatWordCount(countWords(editorEl.value));
  }

  function init() {
    var saved = loadEntry();
    if (saved) {
      titleEl.value = saved.title || "";
      editorEl.value = saved.text || "";
      dateEl.value = saved.date || todayISO();
    } else {
      dateEl.value = todayISO();
    }
    updateWordCount();
  }

  function buildCopyText() {
    var title = titleEl.value.trim();
    var dateLabel = formatArabicDate(dateEl.value || todayISO());
    var text = editorEl.value;
    var lines = [];
    if (title) {
      lines.push(title, "");
    }
    lines.push(dateLabel, "", "");
    lines.push(text);
    return lines.join("\n");
  }

  function showCopyFeedback() {
    var original = "نسخ";
    copyBtn.textContent = "تم النسخ ✓";
    copyBtn.classList.add("is-success");
    liveStatus.textContent = "تم نسخ النص";
    window.clearTimeout(showCopyFeedback._t);
    showCopyFeedback._t = window.setTimeout(function () {
      copyBtn.textContent = original;
      copyBtn.classList.remove("is-success");
    }, 1600);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopyFeedback).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "fixed";
    temp.style.opacity = "0";
    document.body.appendChild(temp);
    temp.focus();
    temp.select();
    try {
      document.execCommand("copy");
      showCopyFeedback();
    } catch (e) {
      /* copy not supported — nothing more we can do silently */
    }
    document.body.removeChild(temp);
  }

  function openDialog() {
    dialog.hidden = false;
    cancelDeleteBtn.focus();
    document.addEventListener("keydown", onDialogKeydown);
  }

  function closeDialog() {
    dialog.hidden = true;
    document.removeEventListener("keydown", onDialogKeydown);
    deleteBtn.focus();
  }

  function onDialogKeydown(e) {
    if (e.key === "Escape") {
      closeDialog();
    }
  }

  function performDelete() {
    titleEl.value = "";
    editorEl.value = "";
    dateEl.value = todayISO();
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      /* ignore */
    }
    closeDialog();
    updateWordCount();
    titleEl.focus();
  }

  titleEl.addEventListener("input", saveEntry);
  dateEl.addEventListener("change", saveEntry);
  editorEl.addEventListener("input", function () {
    saveEntry();
    updateWordCount();
  });

  copyBtn.addEventListener("click", function () {
    copyToClipboard(buildCopyText());
  });

  deleteBtn.addEventListener("click", openDialog);
  cancelDeleteBtn.addEventListener("click", closeDialog);
  confirmDeleteBtn.addEventListener("click", performDelete);

  dialog.addEventListener("click", function (e) {
    if (e.target === dialog) {
      closeDialog();
    }
  });

  init();
})();
</script>

</body>
</html>
